<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users Directory</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Users Directory</h1>
    <div class="bar">
      <input id="search" type="search" placeholder="Search by name or email...">
      <button id="addBtn" class="primary">+ Add User</button>
    </div>
  </header>

  <main>
    <p id="status" class="status">Loading...</p>
    <div id="grid" class="grid"></div>
  </main>

  <dialog id="dlg">
    <form id="form" method="dialog">
      <h2 id="dlgTitle">Add User</h2>
      <input type="hidden" id="uid">
      <label>Name <input id="name" required></label>
      <label>Age <input id="age" type="number" min="0" max="120" required></label>
      <label>Contact <input id="contact" required></label>
      <label>Email <input id="email" type="email" required></label>
      <label>Address <input id="address" required></label>
      <label>Note <textarea id="note" rows="3"></textarea></label>
      <div class="actions">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/static/script.js"></script>
</body>
</html>
